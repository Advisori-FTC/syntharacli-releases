# pre-commit (https://pre-commit.com): `pre-commit install --hook-type pre-commit --hook-type pre-push`
# Alternativ ohne pre-commit: `git config core.hooksPath .githooks`
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit, pre-push]
